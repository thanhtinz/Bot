<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Realm Menu Preview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage" aria-label="Pixel Realm Menu preview">
    <section class="menu-card">
      <div class="mascot" aria-hidden="true">⚡</div>
      <h1>MENU</h1>
      <div class="top-tabs" aria-hidden="true"><span>🧍</span><span>⚙️</span><span>🎫</span></div>
      <div class="grid">
        <button class="cell orange"><span class="icon">🧰</span><span>KITS</span></button>
        <button class="cell green"><span class="icon">🏠</span><span>HOME</span></button>
        <button class="cell blue"><span class="icon">🧬</span><span>WONDER<br>TRADE</span></button>

        <button class="cell orange"><span class="icon">⏱️</span><span>ONLINE<br>REWARDS</span></button>
        <button class="cell green"><span class="icon">📺</span><span>GTS</span></button>
        <button class="cell blue"><span class="icon">🛠️</span><span>POKE<br>BUILDER</span></button>

        <button class="cell orange"><span class="icon">🗓️</span><span>DAILY<br>REWARDS</span></button>
        <button class="cell green"><span class="icon">🛡️</span><span>WARP</span></button>
        <button class="cell blue"><span class="icon">🔴</span><span>PIXEL<br>HUNT</span></button>

        <button class="cell orange"><span class="icon">📘</span><span>DEX<br>REWARDS</span></button>
        <button class="cell green"><span class="icon">🔨</span><span>REPAIR<br>ITEM</span></button>
        <button class="cell blue"><span class="icon">🏆</span><span>POKE<br>TOP</span></button>

        <button class="cell red wide"><span class="icon">🏅</span><span>RANKING</span></button>
        <button class="cell red"><span class="icon">⚾</span><span>GYMS</span></button>
        <button class="cell red"><span class="icon">👥</span><span>TEAMS</span></button>
      </div>
    </section>
    <nav class="dock" aria-label="Quick menu preview">
      <a><span>🗺️</span><b>MAP</b></a>
      <a><span>🎀</span><b>WARDROBE</b></a>
      <a><span>📜</span><b>QUEST</b></a>
      <a><span>📖</span><b>POKEDEX</b></a>
      <a><span>🐟</span><b>PROFILE</b></a>
      <a><span>🔴</span><b>MENU</b></a>
    </nav>
  </main>
</body>
</html>
